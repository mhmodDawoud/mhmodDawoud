<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <title>Mhmod Dawoud — Computer Science Student</title>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#0d1b2e">
        <animate attributeName="stop-color" values="#0d1b2e;#0d1117;#11213a;#0d1b2e" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="55%" stop-color="#9fd6ff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>

    <radialGradient id="vignette" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bgGrad)"/>

  <!-- ambient fragments of his own stack, drifting like distant comments -->
  <g font-family="'Fira Code', 'Cascadia Code', Consolas, monospace" font-size="14" fill="#2f81f7">
    <text x="70" y="40" opacity="0.18">#include &lt;iostream&gt;
      <animate attributeName="opacity" values="0.05;0.28;0.05" dur="6s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="510" y="32" opacity="0.16">class Model:
      <animate attributeName="opacity" values="0.05;0.25;0.05" dur="7s" begin="-1s" repeatCount="indefinite"/>
    </text>
    <text x="750" y="42" opacity="0.18">import pandas as pd
      <animate attributeName="opacity" values="0.05;0.28;0.05" dur="6.5s" begin="-2s" repeatCount="indefinite"/>
    </text>
    <text x="995" y="35" opacity="0.16">int main() {
      <animate attributeName="opacity" values="0.05;0.25;0.05" dur="5.5s" begin="-3s" repeatCount="indefinite"/>
    </text>

    <text x="28" y="155" opacity="0.16">import numpy as np
      <animate attributeName="opacity" values="0.05;0.26;0.05" dur="7.5s" begin="-1.5s" repeatCount="indefinite"/>
    </text>
    <text x="978" y="160" opacity="0.18">def predict(x):
      <animate attributeName="opacity" values="0.05;0.28;0.05" dur="6.2s" begin="-2.5s" repeatCount="indefinite"/>
    </text>

    <text x="55" y="255" opacity="0.16">SELECT * FROM users;
      <animate attributeName="opacity" values="0.05;0.25;0.05" dur="6.8s" begin="-0.5s" repeatCount="indefinite"/>
    </text>
    <text x="410" y="262" opacity="0.18">std::vector&lt;int&gt; v;
      <animate attributeName="opacity" values="0.05;0.27;0.05" dur="7.2s" begin="-3.5s" repeatCount="indefinite"/>
    </text>
    <text x="665" y="255" opacity="0.16">model.fit(X, y)
      <animate attributeName="opacity" values="0.05;0.25;0.05" dur="6s" begin="-2s" repeatCount="indefinite"/>
    </text>
    <text x="945" y="248" opacity="0.18">WHERE score &gt; 90;
      <animate attributeName="opacity" values="0.05;0.28;0.05" dur="7s" begin="-4s" repeatCount="indefinite"/>
    </text>
  </g>

  <rect width="1200" height="300" fill="url(#vignette)"/>

  <text x="600" y="150" text-anchor="middle" font-family="'Fira Code', 'Cascadia Code', Consolas, monospace" font-size="50" font-weight="700" filter="url(#glow)">
    <tspan fill="#3fb950">&lt;</tspan><tspan fill="url(#titleGrad)"> Mhmod Dawoud </tspan><tspan fill="#3fb950">/&gt;</tspan>
  </text>

  <text x="600" y="188" text-anchor="middle" font-family="'Fira Code', Consolas, monospace" font-size="17" fill="#8b949e" letter-spacing="0.5">
    Computer Science Student  •  Aspiring AI / ML Engineer
  </text>

  <rect x="0" y="294" width="1200" height="6" fill="url(#titleGrad)" opacity="0.85">
    <animate attributeName="opacity" values="0.5;0.95;0.5" dur="3.5s" repeatCount="indefinite"/>
  </rect>
</svg>
